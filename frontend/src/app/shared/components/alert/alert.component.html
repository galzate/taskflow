<!-- 10-11-2026 Construido por: Ing GAAE - Accessible alert with automatic dismissal. -->
@if (message(); as text) {
  <p
    class="alert"
    [class.error]="type() === 'error'"
    [class.success]="type() === 'success'"
    [class.leaving]="leaving()"
    [attr.role]="type() === 'error' ? 'alert' : 'status'">
    {{ text }}
  </p>
}
