<!-- 10-11-2026 Construido por: Ing GAAE - Accessible custom select dropdown. -->
<div class="select" [class.open]="isOpen()">
  <button
    type="button"
    class="select-trigger"
    [id]="inputId()"
    role="combobox"
    aria-haspopup="listbox"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="isOpen() ? listboxId : null"
    [attr.aria-activedescendant]="isOpen() && activeIndex() >= 0 ? optionId(activeIndex()) : null"
    [disabled]="isDisabled()"
    (click)="toggle()"
    (keydown)="onTriggerKeydown($event)">
    <span class="select-label" [class.placeholder]="!hasSelectedOption()">{{ selectedLabel() }}</span>
    <span class="select-chevron" aria-hidden="true"></span>
  </button>

  @if (isOpen()) {
    <ul class="select-panel" role="listbox" [id]="listboxId" [attr.aria-labelledby]="inputId() || null">
      @for (option of options(); track option.value; let index = $index) {
        <li
          class="select-option"
          role="option"
          [id]="optionId(index)"
          [class.active]="index === activeIndex()"
          [class.selected]="option.value === value()"
          [class.disabled]="option.disabled"
          [attr.data-option-index]="index"
          [attr.aria-selected]="option.value === value()"
          [attr.aria-disabled]="option.disabled ? 'true' : null"
          (mouseenter)="hoverOption(index, option)"
          (mousedown)="$event.preventDefault()"
          (click)="selectOption(option)">
          <span class="option-label">{{ option.label }}</span>
          @if (option.value === value()) {
            <span class="option-check" aria-hidden="true">✓</span>
          }
        </li>
      }
    </ul>
  }
</div>
